<style>
:root{
  /* Single-theme, black ground; lockup centred, status line below. */
  --bg:#000000;
  --fg:#FFFFFF;
  --muted:#A6A6A6;
  --guide:rgba(255,255,255,.22);
  --track:rgba(255,255,255,.14);
  --font-body:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.1,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);display:grid;place-items:center;padding:24px;overflow:hidden}
main{display:flex;flex-direction:column;align-items:center;gap:clamp(36px,6vw,64px);width:100%}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo{width:min(560px,86vw);height:auto;overflow:visible;display:block}

/* construction guides */
.guide{fill:none;stroke:var(--guide);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease) forwards}
.guide.d2{animation-delay:.15s}.guide.d3{animation-delay:.3s}.guide.d4{animation-delay:.45s}
.guides{animation:settle 1s ease 2.6s forwards}

/* mark pieces */
.piece{fill:var(--fg);transform-box:fill-box;opacity:0}
.piece.top{animation:inTop .9s var(--ease) .9s forwards}
.piece.bottom{animation:inBottom .9s var(--ease) 1.05s forwards}
.word{fill:var(--fg);opacity:0;transform-box:fill-box;animation:inWord .9s var(--ease) 1.7s forwards}

.status{display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;animation:fade .8s ease 2.3s forwards}
.status p{margin:0;font-size:13px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);padding-left:.32em}
.bar{position:relative;width:180px;height:1px;background:var(--track);overflow:hidden}
.bar::after{content:"";position:absolute;inset:0;width:38.2%;background:var(--fg);transform:translateX(-100%);animation:scan 2.4s cubic-bezier(.6,0,.4,1) 2.6s infinite}

@keyframes draw{to{stroke-dashoffset:0}}
@keyframes settle{to{opacity:0}}
@keyframes inTop{from{opacity:0;transform:translate(16px,-32px)}to{opacity:1;transform:none}}
@keyframes inBottom{from{opacity:0;transform:translate(-16px,32px)}to{opacity:1;transform:none}}
@keyframes inWord{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(262%)}}

@media (prefers-reduced-motion:reduce){
  .guide,.guides,.piece,.word,.status,.bar::after{animation:none!important}
  .guide{stroke-dashoffset:0}
  .guides{opacity:0}
  .piece,.word,.status{opacity:1}
  .bar::after{transform:none;width:100%;opacity:.35}
}
</style>
</head>
